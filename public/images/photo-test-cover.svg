      <stop offset=".45" stop-color="#b7432d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#25110e"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="45%">
